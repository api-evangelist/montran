specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Montran
providerId: montran
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Payments
  - Banking
  - Capital Markets
  - Mobile Payments
  - Instant Payments
description: Montran is an enterprise payments and capital-markets software vendor whose products (Instant
  Payments Gateway, Corporate Payments Portal, Mobile Payments, Payments Connectivity, RTGS) ship with
  REST/SOAP APIs to central banks and tier-1/2 banks. Montran does not publish list pricing; deals are
  custom-licensed (typically perpetual or term licenses plus implementation, support, and managed services)
  and quoted per-deployment.
sources:
  - https://www.montran.com
  - https://www.montran.com/solutions/instant-payments-gateway/
  - https://www.montran.com/solutions/corporate-payments-portal/
notes: No public list pricing; reconciliation set to false. Replace with the licensee's commercial schedule
  if available internally.
plans:
  - id: montran-enterprise-license
    name: Enterprise License
    type: enterprise
    description: Direct enterprise license sold to central banks, banks, and financial market infrastructures.
      Per-deployment custom pricing for software, implementation, and support.
    entries:
      - label: Software license
        name: license
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Implementation services
        name: implementation
        type: flat
        metric: project
        limit: -1
        timeFrame: usage
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Annual support and maintenance
        name: support
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Instant Payments Gateway
      - name: Corporate Payments Portal
      - name: Mobile Payments
      - name: Payments Connectivity (REST, SOAP, file, queue)
      - name: PSD2 Open API compliant gateway
      - name: 24x7 operations
