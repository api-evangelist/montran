apis:
- name: Montran Instant Payments System
  description: >-
    A robust 24/7, high-capacity, retail-focused payment solution that processes individual payments in
    real-time with guaranteed end-to-end payment processing latency of a few seconds. Designed for central
    banks and payment system operators.
  humanURL: https://www.montran.com/solutions/instant-real-time-payments/
  tags:
  - Central Banking
  - Clearing
  - Instant Payments
  - Market Infrastructure
  - Real-Time
  properties:
  - type: Documentation
    url: https://www.montran.com/solutions/instant-real-time-payments/
- name: Montran Real-Time Gross Settlement
  description: >-
    Provides secure, real-time settlement of high-value interbank payments. Holds a perfect security track
    record with no successful attacks on any Montran RTGS customer over the past decade.
  humanURL: https://www.montran.com/solutions/real-time-gross-settlement/
  tags:
  - Central Banking
  - High-Value Payments
  - Market Infrastructure
  - RTGS
  - Settlement
  properties:
  - type: Documentation
    url: https://www.montran.com/solutions/real-time-gross-settlement/
- name: Montran Automated Clearing House
  description: >-
    An electronic clearing system that enables the full spectrum of payment instructions to be exchanged
    among financial institutions. Powers some of the largest clearing houses worldwide with support for
    credit transfers, direct debits, and cheques.
  humanURL: https://www.montran.com/solutions/automated-clearing-house/
  tags:
  - ACH
  - Clearing
  - Credit Transfers
  - Direct Debits
  - Payments
  properties:
  - type: Documentation
    url: https://www.montran.com/solutions/automated-clearing-house/
- name: Montran Automated Transfer System
  description: >-
    Handles very high volumes of both high-value and low-value payments such as credit transfers, direct
    debits, and cheques. Provides a unified clearing and settlement platform for diverse payment types.
  humanURL: https://www.montran.com/solutions/automated-transfer-system/
  tags:
  - Clearing
  - High-Value
  - Low-Value
  - Payments
  - Settlement
  properties:
  - type: Documentation
    url: https://www.montran.com/solutions/automated-transfer-system/
- name: Montran Central Securities Depository
  description: >-
    A 24/7, ISO 20022 compliant platform that facilitates safekeeping of dematerialized financial instruments,
    settlement of trades free or against payment, and calculation and distribution of corporate action
    entitlements.
