specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Montran
providerId: montran
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Payments
  - Banking
  - Instant Payments
description: Montran APIs ship inside on-premise / private-cloud deployments at central banks and commercial
  banks; rate limits are sized by the operator to scheme requirements (e.g. instant-payment scheme TPS targets,
  RTGS throughput SLAs). Montran does not publish a public rate-limit document because the limits are
  set per-deployment.
sources:
  - https://www.montran.com
  - https://www.montran.com/solutions/instant-payments-gateway/
notes: No public rate-limit document. Limits will be defined in the deployment's non-functional requirements
  / scheme conformance specification.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Deployment-defined throughput
    scope: deployment
    metric: varies
    limit: see deployment NFRs
    notes: Sized to scheme TPS / SLA (e.g. SCT Inst, FedNow, TIPS, RTP scheme requirements).
policies:
  - name: Scheme conformance
    description: Throughput, latency, and availability targets follow the host scheme's conformance specification
      (e.g. TIPS, SCT Inst, FedNow, RTP) rather than a Montran-published default.
  - name: Operator responsibility
    description: The deploying institution (central bank or commercial bank) sizes infrastructure and
      configures any internal rate-limit policy on top of Montran's gateway.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
