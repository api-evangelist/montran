naftiko: 1.0.0-alpha2
info:
  label: Montran Sanctions Screening API — Lists
  description: 'Montran Sanctions Screening API — Lists. 2 operations. Lead operation: Montran List compliance lists. Self-contained
    Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Lists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: sanctions-screening-lists
    baseUri: https://api.montran.com/efs/v1
    description: Montran Sanctions Screening API — Lists business capability. Self-contained, no shared references.
    resources:
    - name: lists
      path: /lists
      operations:
      - name: listcompliancelists
        method: GET
        description: Montran List compliance lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lists-listId
      path: /lists/{listId}
      operations:
      - name: getcompliancelist
        method: GET
        description: Montran Get compliance list details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: listId
          in: path
          type: string
          description: Unique identifier of the compliance list
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: sanctions-screening-lists-rest
    port: 8080
    description: REST adapter for Montran Sanctions Screening API — Lists. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/lists
      name: lists
      description: REST surface for lists.
      operations:
      - method: GET
        name: listcompliancelists
        description: Montran List compliance lists
        call: sanctions-screening-lists.listcompliancelists
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lists/{listid}
      name: lists-listid
      description: REST surface for lists-listId.
      operations:
      - method: GET
        name: getcompliancelist
        description: Montran Get compliance list details
        call: sanctions-screening-lists.getcompliancelist
        with:
          listId: rest.listId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sanctions-screening-lists-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Sanctions Screening API — Lists. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: montran-list-compliance-lists
      description: Montran List compliance lists
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sanctions-screening-lists.listcompliancelists
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-get-compliance-list-details
      description: Montran Get compliance list details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sanctions-screening-lists.getcompliancelist
      with:
        listId: tools.listId
      outputParameters:
      - type: object
        mapping: $.
