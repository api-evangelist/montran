naftiko: 1.0.0-alpha2
info:
  label: Montran Virtual Accounts API — Balances
  description: 'Montran Virtual Accounts API — Balances. 1 operations. Lead operation: Montran Get virtual account balance.
    Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Balances
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: virtual-accounts-balances
    baseUri: https://api.montran.com/vam/v1
    description: Montran Virtual Accounts API — Balances business capability. Self-contained, no shared references.
    resources:
    - name: virtual-accounts-accountId-balance
      path: /virtual-accounts/{accountId}/balance
      operations:
      - name: getvirtualaccountbalance
        method: GET
        description: Montran Get virtual account balance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: virtual-accounts-balances-rest
    port: 8080
    description: REST adapter for Montran Virtual Accounts API — Balances. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/virtual-accounts/{accountid}/balance
      name: virtual-accounts-accountid-balance
      description: REST surface for virtual-accounts-accountId-balance.
      operations:
      - method: GET
        name: getvirtualaccountbalance
        description: Montran Get virtual account balance
        call: virtual-accounts-balances.getvirtualaccountbalance
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: virtual-accounts-balances-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Virtual Accounts API — Balances. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: montran-get-virtual-account-balance
      description: Montran Get virtual account balance
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: virtual-accounts-balances.getvirtualaccountbalance
      outputParameters:
      - type: object
        mapping: $.
