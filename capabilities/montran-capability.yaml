naftiko: 1.0.0-alpha2
info:
  label: Montran Corporate Payments Portal API
  description: The Montran Corporate Payments Portal enables corporates to exercise complete control over accounts at their
    various bank relationships, with the ability to make secure payments over the Internet. It supports SWIFT payments and
    local clearing delivery through API integration and H2H (Host-to-Host) protocols. Corporates can connect their ERP systems
    and manually or automatically upload invoices for payments and collections management. The portal provides multi-bank
    visibility and supports secure payment initiation across multiple currencies and payment types.
  tags:
  - Montran
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: montran
    baseUri: https://api.montran.com/corporate/v1
    description: Montran Corporate Payments Portal API HTTP API.
    authentication:
      type: bearer
      token: '{{MONTRAN_TOKEN}}'
    resources:
    - name: payments
      path: /payments
      operations:
      - name: listcorporatepayments
        method: GET
        description: Montran List corporate payments
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by payment status
        - name: paymentType
          in: query
          type: string
          description: Filter by payment type
        - name: bankId
          in: query
          type: string
          description: Filter by bank relationship
        - name: currency
          in: query
          type: string
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcorporatepayment
        method: POST
        description: Montran Create a corporate payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments-paymentid
      path: /payments/{paymentId}
      operations:
      - name: getcorporatepayment
        method: GET
        description: Montran Get payment details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments-paymentid-approve
      path: /payments/{paymentId}/approve
      operations:
      - name: approvepayment
        method: POST
        description: Montran Approve a payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments-paymentid-reject
      path: /payments/{paymentId}/reject
      operations:
      - name: rejectpayment
        method: POST
        description: Montran Reject a payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts
      path: /accounts
      operations:
      - name: listbankaccounts
        method: GET
        description: Montran List bank accounts
        inputParameters:
        - name: bankId
          in: query
          type: string
          description: Filter by bank relationship
        - name: currency
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-accountid
      path: /accounts/{accountId}
      operations:
      - name: getbankaccount
        method: GET
        description: Montran Get bank account details
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-accountid-transactions
      path: /accounts/{accountId}/transactions
      operations:
      - name: listaccounttransactions
        method: GET
        description: Montran List account transactions
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files
      path: /files
      operations:
      - name: uploadpaymentfile
        method: POST
        description: Montran Upload a payment file
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-fileid
      path: /files/{fileId}
      operations:
      - name: getfilestatus
        method: GET
        description: Montran Get file processing status
        inputParameters:
        - name: fileId
          in: path
          type: string
          required: true
          description: Unique identifier of the uploaded file
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: beneficiaries
      path: /beneficiaries
      operations:
      - name: listbeneficiaries
        method: GET
        description: Montran List beneficiaries
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createbeneficiary
        method: POST
        description: Montran Create a beneficiary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
