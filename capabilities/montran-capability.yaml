          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /files
      name: uploadpaymentfile
      operations:
      - method: POST
        name: uploadpaymentfile
        description: Montran Upload a payment file
        call: montran.uploadpaymentfile
        outputParameters:
        - type: object
          mapping: $.
