          fileId: rest.fileId
        outputParameters:
        - type: object
          mapping: $.
    - path: /beneficiaries
      name: listbeneficiaries
      operations:
      - method: GET
        name: listbeneficiaries
        description: Montran List beneficiaries
        call: montran.listbeneficiaries
        outputParameters:
        - type: object
          mapping: $.
    - path: /beneficiaries
      name: createbeneficiary
      operations:
      - method: POST
        name: createbeneficiary
        description: Montran Create a beneficiary
        call: montran.createbeneficiary
        outputParameters:
        - type: object
          mapping: $.
