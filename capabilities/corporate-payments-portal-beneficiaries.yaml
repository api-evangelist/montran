naftiko: 1.0.0-alpha2
info:
  label: Montran Corporate Payments Portal API — Beneficiaries
  description: 'Montran Corporate Payments Portal API — Beneficiaries. 2 operations. Lead operation: Montran List beneficiaries.
    Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Beneficiaries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: corporate-payments-portal-beneficiaries
    baseUri: https://api.montran.com/corporate/v1
    description: Montran Corporate Payments Portal API — Beneficiaries business capability. Self-contained, no shared references.
    resources:
    - name: beneficiaries
      path: /beneficiaries
      operations:
      - name: listbeneficiaries
        method: GET
        description: Montran List beneficiaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
      - name: createbeneficiary
        method: POST
        description: Montran Create a beneficiary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: corporate-payments-portal-beneficiaries-rest
    port: 8080
    description: REST adapter for Montran Corporate Payments Portal API — Beneficiaries. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/beneficiaries
      name: beneficiaries
      description: REST surface for beneficiaries.
      operations:
      - method: GET
        name: listbeneficiaries
        description: Montran List beneficiaries
        call: corporate-payments-portal-beneficiaries.listbeneficiaries
        with:
          page: rest.page
          pageSize: rest.pageSize
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createbeneficiary
        description: Montran Create a beneficiary
        call: corporate-payments-portal-beneficiaries.createbeneficiary
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: corporate-payments-portal-beneficiaries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Corporate Payments Portal API — Beneficiaries. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: montran-list-beneficiaries
      description: Montran List beneficiaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: corporate-payments-portal-beneficiaries.listbeneficiaries
      with:
        page: tools.page
        pageSize: tools.pageSize
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-create-beneficiary
      description: Montran Create a beneficiary
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: corporate-payments-portal-beneficiaries.createbeneficiary
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
