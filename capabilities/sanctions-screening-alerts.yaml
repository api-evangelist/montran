naftiko: 1.0.0-alpha2
info:
  label: Montran Sanctions Screening API — Alerts
  description: 'Montran Sanctions Screening API — Alerts. 3 operations. Lead operation: Montran List screening alerts. Self-contained
    Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Alerts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: sanctions-screening-alerts
    baseUri: https://api.montran.com/efs/v1
    description: Montran Sanctions Screening API — Alerts business capability. Self-contained, no shared references.
    resources:
    - name: alerts
      path: /alerts
      operations:
      - name: listalerts
        method: GET
        description: Montran List screening alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by alert status
        - name: severity
          in: query
          type: string
          description: Filter by match severity
        - name: screeningType
          in: query
          type: string
          description: Filter by screening type
        - name: fromDate
          in: query
          type: string
        - name: toDate
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
    - name: alerts-alertId
      path: /alerts/{alertId}
      operations:
      - name: getalert
        method: GET
        description: Montran Get alert details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: alertId
          in: path
          type: string
          description: Unique identifier of the alert
          required: true
    - name: alerts-alertId-resolve
      path: /alerts/{alertId}/resolve
      operations:
      - name: resolvealert
        method: POST
        description: Montran Resolve a screening alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: alertId
          in: path
          type: string
          description: Unique identifier of the alert
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: sanctions-screening-alerts-rest
    port: 8080
    description: REST adapter for Montran Sanctions Screening API — Alerts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/alerts
      name: alerts
      description: REST surface for alerts.
      operations:
      - method: GET
        name: listalerts
        description: Montran List screening alerts
        call: sanctions-screening-alerts.listalerts
        with:
          status: rest.status
          severity: rest.severity
          screeningType: rest.screeningType
          fromDate: rest.fromDate
          toDate: rest.toDate
          page: rest.page
          pageSize: rest.pageSize
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/alerts/{alertid}
      name: alerts-alertid
      description: REST surface for alerts-alertId.
      operations:
      - method: GET
        name: getalert
        description: Montran Get alert details
        call: sanctions-screening-alerts.getalert
        with:
          alertId: rest.alertId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/alerts/{alertid}/resolve
      name: alerts-alertid-resolve
      description: REST surface for alerts-alertId-resolve.
      operations:
      - method: POST
        name: resolvealert
        description: Montran Resolve a screening alert
        call: sanctions-screening-alerts.resolvealert
        with:
          alertId: rest.alertId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sanctions-screening-alerts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Sanctions Screening API — Alerts. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: montran-list-screening-alerts
      description: Montran List screening alerts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sanctions-screening-alerts.listalerts
      with:
        status: tools.status
        severity: tools.severity
        screeningType: tools.screeningType
        fromDate: tools.fromDate
        toDate: tools.toDate
        page: tools.page
        pageSize: tools.pageSize
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-get-alert-details
      description: Montran Get alert details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sanctions-screening-alerts.getalert
      with:
        alertId: tools.alertId
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-resolve-screening-alert
      description: Montran Resolve a screening alert
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sanctions-screening-alerts.resolvealert
      with:
        alertId: tools.alertId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
