naftiko: 1.0.0-alpha2
info:
  label: Montran Payments Connectivity API — Message Formats
  description: 'Montran Payments Connectivity API — Message Formats. 2 operations. Lead operation: Montran Transform a message
    between formats. Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Message Formats
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: payments-connectivity-message-formats
    baseUri: https://api.montran.com/connectivity/v1
    description: Montran Payments Connectivity API — Message Formats business capability. Self-contained, no shared references.
    resources:
    - name: messages-transform
      path: /messages/transform
      operations:
      - name: transformmessage
        method: POST
        description: Montran Transform a message between formats
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: messages-validate
      path: /messages/validate
      operations:
      - name: validatemessage
        method: POST
        description: Montran Validate a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: payments-connectivity-message-formats-rest
    port: 8080
    description: REST adapter for Montran Payments Connectivity API — Message Formats. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/messages/transform
      name: messages-transform
      description: REST surface for messages-transform.
      operations:
      - method: POST
        name: transformmessage
        description: Montran Transform a message between formats
        call: payments-connectivity-message-formats.transformmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/validate
      name: messages-validate
      description: REST surface for messages-validate.
      operations:
      - method: POST
        name: validatemessage
        description: Montran Validate a message
        call: payments-connectivity-message-formats.validatemessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-connectivity-message-formats-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Payments Connectivity API — Message Formats. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: montran-transform-message-between-formats
      description: Montran Transform a message between formats
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-connectivity-message-formats.transformmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-validate-message
      description: Montran Validate a message
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: payments-connectivity-message-formats.validatemessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
