naftiko: 1.0.0-alpha2
info:
  label: Montran Global Payments Hub API — Direct Debits
  description: 'Montran Global Payments Hub API — Direct Debits. 1 operations. Lead operation: Montran Initiate a direct debit.
    Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Direct Debits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: global-payments-hub-direct-debits
    baseUri: https://api.montran.com/gph/v1
    description: Montran Global Payments Hub API — Direct Debits business capability. Self-contained, no shared references.
    resources:
    - name: direct-debits
      path: /direct-debits
      operations:
      - name: initiatedirectdebit
        method: POST
        description: Montran Initiate a direct debit
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: global-payments-hub-direct-debits-rest
    port: 8080
    description: REST adapter for Montran Global Payments Hub API — Direct Debits. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/direct-debits
      name: direct-debits
      description: REST surface for direct-debits.
      operations:
      - method: POST
        name: initiatedirectdebit
        description: Montran Initiate a direct debit
        call: global-payments-hub-direct-debits.initiatedirectdebit
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: global-payments-hub-direct-debits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Global Payments Hub API — Direct Debits. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: montran-initiate-direct-debit
      description: Montran Initiate a direct debit
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: global-payments-hub-direct-debits.initiatedirectdebit
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
