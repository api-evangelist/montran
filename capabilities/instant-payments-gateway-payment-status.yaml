naftiko: 1.0.0-alpha2
info:
  label: Montran Instant Payments Gateway API — Payment Status
  description: 'Montran Instant Payments Gateway API — Payment Status. 2 operations. Lead operation: Montran Get instant payment
    details. Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Payment Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: instant-payments-gateway-payment-status
    baseUri: https://api.montran.com/ipg/v1
    description: Montran Instant Payments Gateway API — Payment Status business capability. Self-contained, no shared references.
    resources:
    - name: payments-instant-paymentId
      path: /payments/instant/{paymentId}
      operations:
      - name: getinstantpayment
        method: GET
        description: Montran Get instant payment details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments-paymentId-status
      path: /payments/{paymentId}/status
      operations:
      - name: getpaymentstatus
        method: GET
        description: Montran Get payment status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: instant-payments-gateway-payment-status-rest
    port: 8080
    description: REST adapter for Montran Instant Payments Gateway API — Payment Status. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/payments/instant/{paymentid}
      name: payments-instant-paymentid
      description: REST surface for payments-instant-paymentId.
      operations:
      - method: GET
        name: getinstantpayment
        description: Montran Get instant payment details
        call: instant-payments-gateway-payment-status.getinstantpayment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/payments/{paymentid}/status
      name: payments-paymentid-status
      description: REST surface for payments-paymentId-status.
      operations:
      - method: GET
        name: getpaymentstatus
        description: Montran Get payment status
        call: instant-payments-gateway-payment-status.getpaymentstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: instant-payments-gateway-payment-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Instant Payments Gateway API — Payment Status. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: montran-get-instant-payment-details
      description: Montran Get instant payment details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: instant-payments-gateway-payment-status.getinstantpayment
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-get-payment-status
      description: Montran Get payment status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: instant-payments-gateway-payment-status.getpaymentstatus
      outputParameters:
      - type: object
        mapping: $.
