naftiko: 1.0.0-alpha2
info:
  label: Montran Payments Connectivity API — Message Routing
  description: 'Montran Payments Connectivity API — Message Routing. 3 operations. Lead operation: Montran List processed
    messages. Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Message Routing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: payments-connectivity-message-routing
    baseUri: https://api.montran.com/connectivity/v1
    description: Montran Payments Connectivity API — Message Routing business capability. Self-contained, no shared references.
    resources:
    - name: messages
      path: /messages
      operations:
      - name: listmessages
        method: GET
        description: Montran List processed messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sourceSystem
          in: query
          type: string
          description: Filter by source system identifier
        - name: destinationSystem
          in: query
          type: string
          description: Filter by destination system identifier
        - name: format
          in: query
          type: string
          description: Filter by message format
        - name: messageType
          in: query
          type: string
          description: Filter by specific message type (e.g., MT103, pacs.008, pain.001, camt.053)
        - name: direction
          in: query
          type: string
          description: Filter by message direction
        - name: status
          in: query
          type: string
          description: Filter by processing status
        - name: fromDate
          in: query
          type: string
          description: Start date filter (ISO 8601)
        - name: toDate
          in: query
          type: string
          description: End date filter (ISO 8601)
        - name: page
          in: query
          type: integer
        - name: pageSize
          in: query
          type: integer
      - name: submitmessage
        method: POST
        description: Montran Submit a message for routing
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: messages-messageId
      path: /messages/{messageId}
      operations:
      - name: getmessage
        method: GET
        description: Montran Get message details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: messageId
          in: path
          type: string
          description: Unique identifier of the message
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: payments-connectivity-message-routing-rest
    port: 8080
    description: REST adapter for Montran Payments Connectivity API — Message Routing. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/messages
      name: messages
      description: REST surface for messages.
      operations:
      - method: GET
        name: listmessages
        description: Montran List processed messages
        call: payments-connectivity-message-routing.listmessages
        with:
          sourceSystem: rest.sourceSystem
          destinationSystem: rest.destinationSystem
          format: rest.format
          messageType: rest.messageType
          direction: rest.direction
          status: rest.status
          fromDate: rest.fromDate
          toDate: rest.toDate
          page: rest.page
          pageSize: rest.pageSize
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submitmessage
        description: Montran Submit a message for routing
        call: payments-connectivity-message-routing.submitmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{messageid}
      name: messages-messageid
      description: REST surface for messages-messageId.
      operations:
      - method: GET
        name: getmessage
        description: Montran Get message details
        call: payments-connectivity-message-routing.getmessage
        with:
          messageId: rest.messageId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: payments-connectivity-message-routing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Payments Connectivity API — Message Routing. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: montran-list-processed-messages
      description: Montran List processed messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: payments-connectivity-message-routing.listmessages
      with:
        sourceSystem: tools.sourceSystem
        destinationSystem: tools.destinationSystem
        format: tools.format
        messageType: tools.messageType
        direction: tools.direction
        status: tools.status
        fromDate: tools.fromDate
        toDate: tools.toDate
        page: tools.page
        pageSize: tools.pageSize
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-submit-message-routing
      description: Montran Submit a message for routing
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: payments-connectivity-message-routing.submitmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-get-message-details
      description: Montran Get message details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: payments-connectivity-message-routing.getmessage
      with:
        messageId: tools.messageId
      outputParameters:
      - type: object
        mapping: $.
