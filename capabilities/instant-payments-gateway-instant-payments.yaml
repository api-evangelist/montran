naftiko: 1.0.0-alpha2
info:
  label: Montran Instant Payments Gateway API — Instant Payments
  description: 'Montran Instant Payments Gateway API — Instant Payments. 4 operations. Lead operation: Montran Submit a bulk
    payment. Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Instant Payments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: instant-payments-gateway-instant-payments
    baseUri: https://api.montran.com/ipg/v1
    description: Montran Instant Payments Gateway API — Instant Payments business capability. Self-contained, no shared references.
    resources:
    - name: payments-bulk
      path: /payments/bulk
      operations:
      - name: submitbulkpayment
        method: POST
        description: Montran Submit a bulk payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: payments-instant
      path: /payments/instant
      operations:
      - name: initiateinstantpayment
        method: POST
        description: Montran Initiate an instant payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: payments-instant-paymentId
      path: /payments/instant/{paymentId}
      operations:
      - name: getinstantpayment
        method: GET
        description: Montran Get instant payment details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments-instant-paymentId-return
      path: /payments/instant/{paymentId}/return
      operations:
      - name: returninstantpayment
        method: POST
        description: Montran Return an instant payment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: instant-payments-gateway-instant-payments-rest
    port: 8080
    description: REST adapter for Montran Instant Payments Gateway API — Instant Payments. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/payments/bulk
      name: payments-bulk
      description: REST surface for payments-bulk.
      operations:
      - method: POST
        name: submitbulkpayment
        description: Montran Submit a bulk payment
        call: instant-payments-gateway-instant-payments.submitbulkpayment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/payments/instant
      name: payments-instant
      description: REST surface for payments-instant.
      operations:
      - method: POST
        name: initiateinstantpayment
        description: Montran Initiate an instant payment
        call: instant-payments-gateway-instant-payments.initiateinstantpayment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/payments/instant/{paymentid}
      name: payments-instant-paymentid
      description: REST surface for payments-instant-paymentId.
      operations:
      - method: GET
        name: getinstantpayment
        description: Montran Get instant payment details
        call: instant-payments-gateway-instant-payments.getinstantpayment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/payments/instant/{paymentid}/return
      name: payments-instant-paymentid-return
      description: REST surface for payments-instant-paymentId-return.
      operations:
      - method: POST
        name: returninstantpayment
        description: Montran Return an instant payment
        call: instant-payments-gateway-instant-payments.returninstantpayment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: instant-payments-gateway-instant-payments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Instant Payments Gateway API — Instant Payments. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: montran-submit-bulk-payment
      description: Montran Submit a bulk payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: instant-payments-gateway-instant-payments.submitbulkpayment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-initiate-instant-payment
      description: Montran Initiate an instant payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: instant-payments-gateway-instant-payments.initiateinstantpayment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-get-instant-payment-details
      description: Montran Get instant payment details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: instant-payments-gateway-instant-payments.getinstantpayment
      outputParameters:
      - type: object
        mapping: $.
    - name: montran-return-instant-payment
      description: Montran Return an instant payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: instant-payments-gateway-instant-payments.returninstantpayment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
