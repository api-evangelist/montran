naftiko: 1.0.0-alpha2
info:
  label: Montran Global Payments Hub API — Payment Status
  description: 'Montran Global Payments Hub API — Payment Status. 1 operations. Lead operation: Montran Get payment status.
    Self-contained Naftiko capability covering one Montran business surface.'
  tags:
  - Montran
  - Payment Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MONTRAN_API_KEY: MONTRAN_API_KEY
capability:
  consumes:
  - type: http
    namespace: global-payments-hub-payment-status
    baseUri: https://api.montran.com/gph/v1
    description: Montran Global Payments Hub API — Payment Status business capability. Self-contained, no shared references.
    resources:
    - name: payments-paymentId-status
      path: /payments/{paymentId}/status
      operations:
      - name: getpaymentstatus
        method: GET
        description: Montran Get payment status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MONTRAN_API_KEY}}'
  exposes:
  - type: rest
    namespace: global-payments-hub-payment-status-rest
    port: 8080
    description: REST adapter for Montran Global Payments Hub API — Payment Status. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/payments/{paymentid}/status
      name: payments-paymentid-status
      description: REST surface for payments-paymentId-status.
      operations:
      - method: GET
        name: getpaymentstatus
        description: Montran Get payment status
        call: global-payments-hub-payment-status.getpaymentstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: global-payments-hub-payment-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for Montran Global Payments Hub API — Payment Status. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: montran-get-payment-status
      description: Montran Get payment status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: global-payments-hub-payment-status.getpaymentstatus
      outputParameters:
      - type: object
        mapping: $.
