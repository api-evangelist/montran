    resources:
    - path: /v1/screen
      name: screen
      description: REST surface for screen.
      operations:
      - method: POST
        name: screentransaction
        description: Montran Screen a transaction
        call: sanctions-screening-screening.screentransaction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
