    resources:
    - name: screen
      path: /screen
      operations:
      - name: screentransaction
        method: POST
        description: Montran Screen a transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: screen-batch
      path: /screen/batch
      operations:
      - name: screenbatch
        method: POST
        description: Montran Screen a batch of transactions
        outputRawFormat: json
        outputParameters:
        - name: result
