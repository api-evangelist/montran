specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Montran
providerId: montran
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Payments
  - Banking
  - Capital Markets
description: 'FOCUS-aligned FinOps profile for Montran: enterprise software licensed to central banks
  and banks. Costs are dominated by perpetual / term licenses, implementation services, and annual support
  rather than a metered cloud spend. No public usage API.'
sources:
  - https://www.montran.com
notes: Reconciliation set to false absent a public billing surface. License-based cost model documented
  per general industry practice for payments software.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Montran Corporation
serviceCategory: Payments / Capital Markets Software
billingModel:
  pricingCategory: Enterprise License + Services
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Montran
  ServiceCategory: Payments Software
  ProviderName: Montran
  PublisherName: Montran Corporation
  InvoiceIssuerName: Montran Corporation
  BillingCurrency: USD
meters:
  - name: license_fees
    unit: year
    aggregation: sum
    dimensions:
      - product
      - environment
  - name: implementation_services
    unit: project
    aggregation: sum
    dimensions:
      - product
      - phase
  - name: support_maintenance
    unit: year
    aggregation: sum
    dimensions:
      - product
      - tier
principles:
  - name: Visibility
    description: Track Montran license, implementation, and support invoices in the financial system; product-line
      visibility comes from the deployed Montran modules (Instant Payments Gateway, Corporate Payments Portal,
      RTGS, etc.).
  - name: Allocation
    description: Allocate Montran spend by product line and operating environment (production, DR, sandbox)
      so payments operations and IT each carry their share.
  - name: Optimization
    description: Optimization is realized through scope at procurement (which modules and environments
      are licensed) and right-sizing the infrastructure footprint that hosts Montran.
  - name: Accountability
    description: Payments operations owns the business case; IT owns the hosting cost; procurement owns
      the renewal calendar.
maintainers:
